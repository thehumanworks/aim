[package]
name = "aim"
description = "aim's agent layer: sessions, the native agent loop, providers, CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "aim"
path = "src/main.rs"

[dependencies]
aim-acp = { path = "../aim-acp" }
aim-kernel = { path = "../aim-kernel" }
aim-llm = { path = "../aim-llm" }
aim-llm-codex = { path = "../aim-llm-codex" }
aim-llm-openai = { path = "../aim-llm-openai" }
aim-proto = { path = "../aim-proto" }
aim-rpc = { path = "../aim-rpc" }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
nix = { version = "0.31", default-features = false, features = ["user"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tempfile = "3"
typesafe-jev = "=0.2.0"
uuid = { version = "1.26", features = ["v4"] }
# SKILL.md / agent frontmatter. Only its event parser is used (aliases refused, bounded): see
# `resources::yaml`.
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
async-stream = "0.3"

[lints]
workspace = true
