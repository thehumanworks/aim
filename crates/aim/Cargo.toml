[package]
name = "aim"
description = "aim's agent layer: sessions, the native agent loop, providers, CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "aim"
path = "src/main.rs"

[features]
# Test-only hooks (a scripted provider and a fake workspace behind `aim --script`). Never in
# default or release builds; `cargo test` enables it through the self dev-dependency below.
test-support = []

[dependencies]
aim-acp = { path = "../aim-acp" }
aim-coderun = { path = "../aim-coderun" }
aim-kernel = { path = "../aim-kernel" }
aim-llm = { path = "../aim-llm" }
aim-llm-codex = { path = "../aim-llm-codex" }
aim-llm-openai = { path = "../aim-llm-openai" }
aim-plugin = { path = "../aim-plugin" }
aim-proto = { path = "../aim-proto" }
aim-rpc = { path = "../aim-rpc" }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ignore = "0.4"
nix = { version = "0.31", default-features = false, features = ["user"] }
model2vec-rs = { version = "=0.3.0", default-features = false, features = ["onig", "local-only"] }
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "stream"] }
rmcp = { version = "=3.4.1", default-features = false, features = ["auth", "client", "reqwest", "transport-async-rw", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rustls = "0.23"
rustls-pemfile = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "signal", "net", "fs"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tempfile = "3"
typesafe-jev = "=0.2.0"
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { version = "1.26", features = ["v4", "v7"] }
# SKILL.md / agent frontmatter. Only its event parser is used (aliases refused, bounded): see
# `resources::yaml`.
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
# Enables the test-only hooks for this crate's own tests (the PTY tests drive `aim --script`).
aim = { path = ".", features = ["test-support"] }
aimx = { path = "../aimx" }
async-stream = "0.3"
portable-pty = "0.9"
vt100 = "0.16"

[lints]
workspace = true
