[package]
name = "aimx"
description = "aim's execution layer: workspaces, tools and their enforcement, served over aim-harness/1 and MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "aimx"
path = "src/main.rs"

[dependencies]
aim-kernel = { path = "../aim-kernel" }
aim-proto = { path = "../aim-proto" }
aim-rpc = { path = "../aim-rpc" }
clap = { version = "4.6", features = ["derive"] }
futures-core = "0.3"
getrandom = "0.3"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4.33"
memchr = "2"
portable-pty = "0.9"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1.9"
tempfile = "3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "test-util"] }

[lints]
workspace = true
