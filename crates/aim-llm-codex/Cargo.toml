[package]
name = "aim-llm-codex"
description = "ChatGPT Codex subscription provider for aim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
aim-llm = { path = "../aim-llm" }
aim-proto = { path = "../aim-proto" }
async-stream = "0.3"
base64 = "0.22"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"

[lints]
workspace = true
