[package]
name = "aim-llm-openai"
description = "OpenAI-compatible model provider with data-driven gateway profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
aim-llm = { path = "../aim-llm" }
aim-proto = { path = "../aim-proto" }
async-stream = "0.3"
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[lints]
workspace = true
