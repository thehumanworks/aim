[package]
name = "aim-web"
description = "Browser chat client for the aim daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aim-proto = { path = "../aim-proto" }
leptos = { version = "=0.8.15", features = ["csr"] }
# Markdown in agent surfaces becomes elements and text nodes, never HTML (ADR 0064).
pulldown-cmark = { version = "0.13", default-features = false }
serde = "1"
serde_json = "1"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Window", "Location", "Storage", "Event", "HtmlElement"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
