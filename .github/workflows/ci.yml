# The same gates agents run locally (AGENTS.md): `mise run check` and `mise run verify`.
# Verification runs on x86_64 Linux: Verus publishes no linux-arm64 build (docs/research/verus.md).
# Live smoke tests (`mise run smoke`) need the maintainer's credentials and run outside CI.
name: ci

# Manual for now: GitHub refuses to start jobs on this account until its Actions billing/spending
# limit is fixed (2026-09-25). Restore the `push`/`pull_request` triggers once it is — until then
# agents run `mise run check` and `mise run verify` locally before every push (AGENTS.md).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: mise run check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/verus
      - run: mise run verify
