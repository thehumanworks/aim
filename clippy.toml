# Workspace-wide clippy configuration (docs/adr/0004).
# OS access in the execution layer (std::fs / std::process / tokio::fs / tokio::process) is confined
# to aimx's backends and server plumbing by `cargo xtask check` (a module-level rule clippy cannot
# express), so every tool call goes through the Workspace trait and can be shadowed over SSH.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = false
# Product names that are not code (keeps help text readable); ".." keeps clippy's defaults.
doc-valid-idents = ["ChatGPT", "OpenRouter", ".."]
