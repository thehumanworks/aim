# ADR 0024 comparison contract. Changing this file makes a new benchmark cohort.
version = 1
hardware = "macOS arm64, report host details in each result"
topology = "local, loopback HTTP recording proxy, fresh git worktree per run"
permissions = "workspace read/write/exec; no hosted search; no network tool"
aim_code_mode = "enabled, with a built and explicitly selected aim-coderun worker"
cache_state = "fresh isolated HOME per trial; one recorded mock prewarm per harness before timed trials"
token_estimate = "ceil(uncompressed request JSON bytes / 4); provider usage is separate"

[wire]
model = "gpt-5.5"
effort = "low"
repetitions = 2
harnesses = ["aim_openrouter", "codex", "pi"]
optional_harnesses = ["omp", "unreal"] # require pinned local artifacts supplied to run.py
max_concurrency = 1
prewarm_mock_runs = 1
aim_w1_max_bytes = 6000
aim_w2_max_tool_output_chars = 12088
aim_expected_tools = 10
aim_max_auxiliary_requests = 1

[[wire.case]]
id = "W1"
scenario = "reply"
prompt = "Reply with OK."
steps = 0

[[wire.case]]
id = "W2"
scenario = "big_output"
prompt = "Run the shell command and then reply OK."
command = "seq 1 100000"
steps = 1

[[wire.case]]
id = "W3"
scenario = "big_file"
prompt = "Read big.txt and then reply OK."
command = "cat big.txt"
steps = 1

[[wire.case]]
id = "W4"
scenario = "steps"
prompt = "Run the requested command twenty times, then reply OK."
command = "true"
steps = 20

[live]
repetitions = 2
max_concurrency = 1
prewarm_mock_runs = 1
max_spend_usd = 1.00
max_request_spend_usd = 0.60 # reserved at the proxy before each OpenRouter request; reviewed model/context bound
unpriced_transport_reserve_usd = 0.05
max_subscription_runs = 12
pass_noninferiority_delta_pp = 8
openrouter_model = "openai/gpt-4.1-mini"
codex_model = "gpt-6-sol"
codex_effort = "low"
harnesses = ["aim_openrouter", "codex_openrouter", "aim_codex"]
timeout_seconds = 180

[[live.task]]
id = "even_sum"
grader = "python3 -m unittest -q"
prompt = "Fix sum_even in calc.py. Run the tests and keep the public function name."

[[live.task]]
id = "clamp"
grader = "python3 -m unittest -q"
prompt = "Implement clamp(value, low, high) in mathutil.py. Run the tests."

[[live.task]]
id = "slug"
grader = "python3 -m unittest -q"
prompt = "Fix slugify in strings.py so the tests pass. Run the tests."

[[live.task]]
id = "retry"
grader = "python3 -m unittest -q"
prompt = "Fix retry in retry.py so it makes exactly the allowed attempts. Run the tests."

[[live.task]]
id = "ledger"
grader = "python3 -m unittest -q"
prompt = "Fix total_cents in ledger.py. Run the tests."

[[live.task]]
id = "normalize"
grader = "python3 -m unittest discover -q"
prompt = "Fix unique_sorted in normalize.py. Run the tests."

# Scripting tasks (T4b): fan-out over many files, then one written answer, graded by hidden
# tests on the report (bench/live_tasks.py `HIDDEN_TESTS`).
[[live.task]]
id = "todo_table"
grader = "hidden REPORT.md check"
prompt = "Count the TODO and FIXME comments in every file under src/. Write REPORT.md containing a markdown table with the columns file, TODO and FIXME, and one row per file under src/, including files that have none."

[[live.task]]
id = "callers"
grader = "hidden CALLERS.md check"
prompt = "Find every function or method in this repository that calls load_config (not load_config_file; imports, comments and docstrings are not calls). Write CALLERS.md with one line per call, formatted as path:line function_name, where path is relative to the repository root and line is the line of the call."

[[live.task]]
id = "doc_index"
grader = "hidden INDEX.md check"
prompt = "Write INDEX.md listing every Markdown file under docs/ with its first heading, one line per file, formatted as - path: heading."

# T4b: which AIM_CODE_MODE aim defaults to (ADR 0076). Pre-registered in bench/plans/code-mode.md
# before any live run; `bench/code_mode.py` applies this rule to the recorded results.
[code_mode]
arms = ["aim_openrouter@off", "aim_openrouter@on", "aim_openrouter@only"]
reference = "aim_openrouter@off"
repetitions = 3
scripting_tasks = ["todo_table", "callers", "doc_index"]
min_scripting_gain_pct = 25          # fewer mean model requests, or lower ITE per passed task, than off
max_scripting_loss_pct = 10          # and the other of the two at most this much worse
max_existing_ite_regression_pct = 10 # ITE per passed task on the six existing tasks
secondary_arms = ["aim_codex@off", "aim_codex@on", "acp_claude@off", "acp_claude@on"]
secondary_repetitions = 2
acp_model = "sonnet"
acp_timeout_seconds = 300
