# aim toolchain and tasks. Every tool is pinned here (docs/adr/0003); `mise install` sets up a
# working checkout, `mise run check` is the quality gate and `mise run verify` checks the proofs.
#
# Rust and Verus move together: each Verus release pins exactly one rustc (read it from the tag's
# `rust-toolchain.toml`), and `cargo verus` compiles the verified crate's whole dependency closure
# with that rustc. Bump both in one commit, then refresh `mise.lock`.

[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
# Claude Code over ACP (docs/adr/0012): the adapter is pinned exactly and gated by aim's live
# capability probe at every bump. Node runs it (`#!/usr/bin/env node`). These must stay under
# `[tools]` — below a `[tools."…"]` table they would silently become that tool's options.
node = "26.8.1"
python = "3.14.7"
lightpanda = "0.4.1"
"npm:@agentclientprotocol/claude-agent-acp" = "0.81.2"
# Benchmark peers (ADR 0024): local pins, never a workstation-global latest shim.
codex = "0.158.0-alpha.10"
pi = "0.87.1"
bun = "1.4.2"

# Browser bundle for ADR 0023. `trunk` alone resolves to an unrelated npm package in mise.
[tools."github:trunk-rs/trunk"]
version = "0.21.14"
filter_bins = ["trunk"]

[tools."cargo:wasm-bindgen-cli"]
version = "0.2.128"

# Verus tags look like `release/0.2026.09.20.aef82ed`; `version_prefix` strips `release/`.
# The archive also carries z3/rust_verify/…; only the two entry points go on PATH.
[tools."github:verus-lang/verus"]
version = "0.2026.09.20.aef82ed"
version_prefix = "release/"
filter_bins = ["verus", "cargo-verus"]

# rustfmt does not format inside `verus! {}`; verusfmt does (kernel only).
[tools."github:verus-lang/verusfmt"]
version = "0.7.3"

[settings]
lockfile = true

[tasks.check]
description = "Quality gate: fmt, clippy (-D warnings), tests, repository invariants"
run = [
  "cargo fmt --all --check",
  "verusfmt --check crates/aim-kernel/src/*.rs",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "cargo xtask check",
  "mise run bench:wire",
]

[tasks.verify]
description = "Verify aim-kernel with Verus (--no-cheating: no assume/admit/external_body)"
# Changing Verus flags does not invalidate cargo's cache, so always re-verify the kernel crate.
run = [
  "cargo clean -p aim-kernel --target-dir target/verus",
  # --no-cheating applies to aim-kernel only: vstd itself legitimately contains trusted axioms.
  "cargo verus verify -p aim-kernel --target-dir target/verus --fwd-verus-args-to roots -- --no-cheating --time",
]

[tasks."verify:fast"]
description = "Re-verify the kernel only (vstd proofs come from cache); for the edit loop"
run = "cargo verus focus -p aim-kernel --target-dir target/verus"

[tasks.fmt]
description = "Format everything (rustfmt + verusfmt for the kernel)"
run = ["cargo fmt --all", "verusfmt crates/aim-kernel/src/*.rs"]

[tasks.smoke]
description = "Live smoke tests against real services (needs credentials; required before merging integrations)"
run = "cargo test --workspace --locked -- --ignored live_"

[tasks."smoke:offline"]
description = "Offline canary for a staged gate trial artifact"
run = "CARGO_NET_OFFLINE=true CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 cargo test --workspace --locked"

[tasks."gate:build"]
description = "Build the trusted gate binary from a pinned protected source revision"
run = "CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 cargo build -p aim-gate --bin aim-gate --locked"

[tasks."web:build"]
description = "Build the browser bundle separately from the native quality gate (WASM link dominates routine checks)"
run = "cd crates/aim-web && NO_COLOR=true trunk build --release --locked --offline && python externalize_bootstrap.py"

[tasks."locked:update"]
description = "Re-record LOCKED spec digests after a maintainer-approved decision change (with its ADR)"
run = "cargo xtask locked --update"

[tasks."bench:wire"]
description = "Offline ADR 0024 wire cohort: pinned peers, scripted proxy, no credentials"
run = [
  "CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 cargo build -p aim -p aimx -p aim-coderun --bins --locked",
  "python3 -B -m unittest discover -s bench -p 'test_*.py'",
  "python3 -B bench/run.py wire --out bench/history/latest-wire.json",
]

[tasks."bench:live"]
description = "Manual paid coding cohort with manifest spend and subscription-run caps"
run = [
  "CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 cargo build -p aim -p aimx -p aim-coderun --bins --locked",
  "python3 -B bench/run.py live --out bench/history/latest-live.json",
]
